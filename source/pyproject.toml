[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticstudio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.60,<2",
    "pydantic>=2.13,<2.14",
    "SQLAlchemy>=2.1.3,<2.2",
    "alembic>=1.20,<1.21",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17", "mypy>=2.4,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

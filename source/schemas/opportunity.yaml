# Canonical Opportunity contract. Field names mirror agenticstudio.domain.
contract_version: 1
validation:
  strict: true
  extra_fields: forbidden at every model level
  immutable: frozen models; collections are tuples of strings
  python_input: UUID objects, Decimal money, aware datetime objects, tuple collections
  json_input: UUID strings, decimal strings, ISO-8601 aware datetimes, array collections
  numbers: finite; scores are integers 0..100; probabilities are numbers 0..1
  defaults: omitted nullable fields default to null; required fields have no default
identity:
  id: opaque UUID4; generated independently on omission; supplied IDs must be UUID4
  source_identity: source name + URL + optional external_id; separate from internal ID
  deduplication: not implemented; source identity never determines the internal ID
fields:
  id: UUID4 (generated by default)
  source:
    name: string (required)
    url: string (required; preserved source URL, no normalization)
    external_id: string|null
    risk_class: core|controlled|experimental (required)
  posted_at: timezone-aware datetime|null
  problem:
    raw_text: string (required)
    summary: string (required)
    expected_deliverable: string|null
  commercial: # optional section; defaults shown below
    currency: string|null
    budget_min: non-negative Decimal|null
    budget_max: non-negative Decimal|null
    pricing_model: fixed|hourly|bounty|unknown (default unknown)
    # When both bounds are present, budget_min <= budget_max.
  signals:
    repo_available: boolean|null
    acceptance_clarity: integer 0..100 (required)
    competition_estimate: integer 0..100|null
    client_quality: integer 0..100|null
    strategic_reuse_value: integer 0..100 (required)
  risk:
    technical_uncertainty: integer 0..100 (required)
    scope_uncertainty: integer 0..100 (required)
    maintenance_burden: integer 0..100 (required)
    legal_or_platform_risk: integer 0..100 (required)
    abuse_risk: integer 0..100 (required)
    payment_or_dispute_risk: integer 0..100 (required)
  estimate:
    required_capabilities: tuple of strings (default empty)
    human_minutes: non-negative number|null
    execution_cost: non-negative Decimal|null
    delivery_probability: number 0..1 (required)
    win_probability: number 0..1 (required)
    expected_value: signed Decimal|null
    confidence: integer 0..100 (required)
  decision: # optional section
    status: new|rejected|shortlisted|investigating|pursuing|proposal_sent|won|lost|delivered (default new)
    reasons: tuple of strings (default empty)
  outcome: # optional section; all fields default to null
    revenue_won: non-negative Decimal|null
    revenue_collected: non-negative Decimal|null
    actual_human_minutes: non-negative number|null
    actual_execution_cost: non-negative Decimal|null
    maintenance_incidents: non-negative integer|null
    dispute_or_refund: boolean|null
    notes: string|null
lifecycle:
  module: agenticstudio.lifecycle
  api: allowed_transitions(status), can_transition(current, target), transition(opportunity, target)
  behavior: returns a new validated Opportunity with the same ID and preserved reasons
  invalid_transition: InvalidTransitionError; includes self-transitions
  allowed:
    new: [rejected, shortlisted, investigating]
    shortlisted: [rejected, investigating, pursuing]
    investigating: [rejected, shortlisted, pursuing]
    pursuing: [rejected, proposal_sent, lost]
    proposal_sent: [won, lost]
    won: [delivered]
    rejected: []
    lost: []
    delivered: []
